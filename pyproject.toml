[project]
name = "socassess"
version = "0.1.0"
description = "Supervisory analytics for SOC assessment"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["socassess"]
